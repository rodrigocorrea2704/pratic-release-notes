<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Notas de Alterações — Pratic RH</title>
    <style>
        .release-notes-container { max-width: 860px; margin: 0 auto; padding: 1.5rem; font-family: sans-serif; }
        .release-notes-container h1 { font-size: 1.4rem; color: #2c3e50; }
        .release-notes-container h2 { font-size: 1.1rem; color: #34495e; margin-top: 1.5rem; }
        .release-notes-container p  { line-height: 1.6; color: #444; }
        .release-notes-container hr { border: none; border-top: 1px solid #ddd; margin: 1rem 0; }
    </style>
</h:head>

<h:body>
    <!-- carrega as notas ao abrir a página -->
    <f:metadata>
        <f:viewAction action="#{releaseNotesBean.carregarNotas}" />
    </f:metadata>

    <div class="release-notes-container">

        <h:panelGroup rendered="#{not empty releaseNotesBean.erro}">
            <p:messages severity="error" />
            <p>#{releaseNotesBean.erro}</p>
        </h:panelGroup>

        <h:panelGroup rendered="#{empty releaseNotesBean.erro}">
            <!-- outputText com escape=false renderiza o HTML gerado pelo flexmark -->
            <h:outputText value="#{releaseNotesBean.notasHtml}" escape="false" />
        </h:panelGroup>

    </div>
</h:body>
</html>
