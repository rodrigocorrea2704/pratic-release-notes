name: Gerar Notas de Alterações

on:
  schedule:
    # Segunda a sábado às 09:00 horário de Brasília (12:00 UTC)
    - cron: '0 12 * * 1-6'
  workflow_dispatch:
    # Permite rodar manualmente pelo GitHub (útil para testes)

permissions:
  contents: write

jobs:
  gerar-notas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Definir data de referência
        id: data
        run: echo "hoje=$(TZ=America/Sao_Paulo date '+%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Gerar notas de alterações
        id: gerar
        env:
          PRATIC_TOKEN: ${{ secrets.PRATIC_TOKEN }}
          TZ: America/Sao_Paulo
        run: |
          python scripts/gerar_notas.py 2>&1 | tee /tmp/saida.txt
          {
            echo 'saida<<__EOF__'
            cat /tmp/saida.txt
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Publicar notas no repositório
        id: publicar
        run: |
          git config user.name  "Pratic Bot"
          git config user.email "bot@praticsite.com.br"
          git add release-notes/
          if git diff --cached --quiet; then
            echo "publicado=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Nenhuma alteração para publicar."
          else
            git commit -m "notas: $(TZ=America/Sao_Paulo date '+%d/%m/%Y')"
            git push
            echo "publicado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar notificação por e-mail
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: rodrigocorrea2704@gmail.com
          from: "Pratic Bot <${{ secrets.GMAIL_USERNAME }}>"
          subject: "📋 Pratic RH — ${{ steps.data.outputs.hoje }} — ${{ job.status == 'success' && (steps.publicar.outputs.publicado == 'true' && 'Notas publicadas ✅' || 'Sem OSs novas ℹ️') || 'Erro na execução ❌' }}"
          body: |
            Execução automática — Gerador de Notas Pratic RH
            ═══════════════════════════════════════════════

            ${{ steps.gerar.outputs.saida }}

            ───────────────────────────────────────────────
            Status do job   : ${{ job.status }}
            Notas publicadas: ${{ steps.publicar.outputs.publicado == 'true' && 'Sim ✅' || 'Não' }}

            Ver execução completa:
            https://github.com/rodrigocorrea2704/pratic-release-notes/actions